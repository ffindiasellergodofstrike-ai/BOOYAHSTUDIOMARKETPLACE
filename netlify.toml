[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NODE_ENV = "production"
  PNPM_VERSION = "10.34.5"
  # The production runtime still needs build-time tsx/esbuild/typecheck tools installed.
  PNPM_FLAGS = "--prod=false"

[functions]
  node_bundler = "esbuild"
  included_files = ["build/api-app.mjs", "dist/index.html"]
  external_node_modules = ["serverless-http", "@supabase/supabase-js", "bcryptjs", "cookie-parser", "cors", "express", "express-async-errors", "helmet", "multer", "pdf-lib", "resend", "zod"]

[functions."reconcile-schedule"]
  schedule = "15 * * * *"

# API routing wins over static files and always preserves JSON errors.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/product/*"
  to = "/.netlify/functions/api/product/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/creators/*"
  to = "/.netlify/functions/api/creators/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/store/*"
  to = "/.netlify/functions/api/store/:splat"
  status = 200
  force = true

# Real files in dist (assets, images, previews) remain on the CDN.
# Unknown/public profile routes reach the status-aware Express HTML renderer, not an unconditional index.html.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

